# Cwal palette template (cwal / pywal / wallust in pywal mode).
# Surfaces, text, accent, tooltips, file types and age colors are filled in from
# the generated 16-color palette: color0 is the background, color8 the secondary
# tone and color15 the foreground. The status colors (danger, success, warning)
# and the hue-named folder colors stay fixed so they keep their meaning; they
# come from a community theme released into the public domain under the
# Unlicense, with syntax colors from the Atom editor's One Light and One Dark
# themes, whose license notice is embedded below for redistribution.
