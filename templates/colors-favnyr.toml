file_document = "#{color4.strip}"
file_image = "#{color1.strip}"
file_video = "#{color6.strip}"
file_registry = "#{color7.strip}"
folder_default = "#{color3.strip}"
folder_red = "#E06C75"
folder_green = "#98C379"
folder_teal = "#56B6C2"
folder_blue = "#61AFEF"
folder_violet = "#C678DD"
folder_pink = "#D372A9"
folder_slate = "#{color7.strip}"
