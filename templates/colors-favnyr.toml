# EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF
# MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE AND
# NONINFRINGEMENT. IN NO EVENT SHALL THE AUTHORS OR COPYRIGHT HOLDERS BE
# LIABLE FOR ANY CLAIM, DAMAGES OR OTHER LIABILITY, WHETHER IN AN ACTION
# OF CONTRACT, TORT OR OTHERWISE, ARISING FROM, OUT OF OR IN CONNECTION
# WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE SOFTWARE.
#
# Template syntax: every color is written as "#" plus a color slot with the
# strip modifier, which is valid in pywal, wallust (pywal mode) and cwal. Do not
# add any other curly braces to this file: pywal treats them as placeholders.
# The palette comes from one run, so generate it with the mode (dark or light)
# that matches the section the application is using.

schema_version = 1

[light.opacity]
hidden = 0.58
age = 0.16

[light.colors]
background = "#{color0.strip}"
surface = "#{color0.strip}"
toolbar = "#{color0.strip}"
alternate_background = "#{color8.strip}"
foreground = "#{color15.strip}"
border = "#{color8.strip}"
accent_background = "#{color4.strip}"
accent_foreground = "#{color1.strip}"
danger = "#D72020"
danger_foreground = "#FFFFFF"
success = "#4EA24C"
warning = "#986800"
extension = "#{color12.strip}"
track = "#{color8.strip}"
disk_normal = "#{color7.strip}"
tooltip_background = "#{color15.strip}"
tooltip_foreground = "#{color1.strip}"
shadow = "#000000"
modal_overlay = "#{color15.strip}73"
file_application = "#{color2.strip}"
file_archive = "#{color3.strip}"
file_audio = "#{color5.strip}"
file_document = "#{color4.strip}"
file_image = "#{color1.strip}"
file_video = "#{color6.strip}"
file_registry = "#{color7.strip}"
folder_default = "#{color3.strip}"
folder_red = "#E75545"
folder_green = "#4EA24C"
folder_teal = "#0084BC"
folder_blue = "#3D74F6"
folder_violet = "#A625A4"
folder_pink = "#C63D74"
folder_slate = "#{color7.strip}"
age_hour = "#{color1.strip}"
age_hours = "#{color3.strip}"
age_day = "#{color11.strip}"
age_week = "#{color2.strip}"
age_month = "#{color6.strip}"
age_year = "#{color4.strip}"
age_older = "#{color7.strip}"

[dark.opacity]
hidden = 0.55
age = 0.20

[dark.colors]
background = "#{color0.strip}"
surface = "#{color0.strip}"
toolbar = "#{color0.strip}"
alternate_background = "#{color8.strip}"
foreground = "#{color15.strip}"
border = "#{color8.strip}"
accent_background = "#{color4.strip}"
accent_foreground = "#{color0.strip}"
danger = "#E06C75"
danger_foreground = "#20242B"
success = "#98C379"
warning = "#E5C07B"
extension = "#{color12.strip}"
tooltip_background = "#{color0.strip}"
tooltip_foreground = "#{color15.strip}"
shadow = "#000000"
modal_overlay = "#00000099"
file_application = "#{color2.strip}"
